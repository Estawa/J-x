<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF8A3D" />
    <title>Vacances J-X by C. Guilhem</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #201A2B;
        --muted: #6B6280;
        --muted-soft: #8B8299;
        --line: #EDE7F5;
        --card: #FFFFFF;
        --bg: #F6F2FB;
        --primary: #FF6B35;
        --primary-soft: #FFE3D3;
        --accent: #FF3D81;
        --accent-soft: #FFE0EC;
      }
      :root[data-theme="dark"] {
        --ink: #F3EEFB;
        --muted: #C9C0DA;
        --muted-soft: #9C93B0;
        --line: #3A3350;
        --card: #241E33;
        --bg: #16121F;
        --primary: #FF8A5C;
        --primary-soft: #4A2E23;
        --accent: #FF6FA0;
        --accent-soft: #4A2438;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #F3EEFB;
          --muted: #C9C0DA;
          --muted-soft: #9C93B0;
          --line: #3A3350;
          --card: #241E33;
          --bg: #16121F;
          --primary: #FF8A5C;
          --primary-soft: #4A2E23;
          --accent: #FF6FA0;
          --accent-soft: #4A2438;
        }
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Nunito', sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      button, input, textarea, select { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
